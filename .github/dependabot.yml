# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: 'npm' # to check npm dependencies
    directory: '/'
    schedule:
      interval: 'daily' # runs MO to FR
    ignore:
      # TypeScript 7 drops the JS compiler API that typescript-eslint and
      # ts-jest load. Remove once both support it.
      - dependency-name: 'typescript'
        versions: ['7.x']
  - package-ecosystem: "github-actions" # to check versions of github actions we use
    directory: "/"
    schedule:
      interval: "daily"
